<!DOCTYPE html>
<html>
<head>
    <title>Form Tracker Test</title>
</head>
<body>
    <h1>Form Tracker Test</h1>
    
    <form id="test-form">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea>
        </div>
        
        <button type="submit">Submit</button>
    </form>

    <script type="module">
        // Mock logger and track function for testing
        const logger = {
            debug: (...args) => console.log('[DEBUG]', ...args),
            info: (...args) => console.log('[INFO]', ...args),
            error: (...args) => console.error('[ERROR]', ...args),
            success: (...args) => console.log('[SUCCESS]', ...args),
            warning: (...args) => console.warn('[WARNING]', ...args)
        };
        
        const track = (eventName, properties) => {
            console.log('🔥 TRACKED EVENT:', eventName, properties);
            return { success: true, eventId: 'test-' + Date.now() };
        };
        
        // Import and test (you'll need to adjust the import path)
        import { createFormTracker } from '../src/browser/form.ts';
        
        const formTracker = createFormTracker(track, logger);
        const form = document.getElementById('test-form');
        
        // Track with debug enabled
        console.log('Setting up form tracking...');
        formTracker.trackForm(form, {
            formId: 'test-form',
            trackFocus: true,
            trackInput: true, 
            trackChange: true,
            trackSubmit: true,
            trackAbandon: true
        });
        
        console.log('Form tracking setup complete. Try interacting with the form!');
    </script>
</body>
</html>
